name: Build Android Companion APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-capture/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Run Kotlin unit tests and assemble debug APK
        working-directory: android-capture
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: livecast-android-capture-debug-apk
          path: android-capture/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
