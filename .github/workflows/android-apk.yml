name: Build Android Companion APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-capture/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Run Kotlin unit tests and assemble debug APK
        working-directory: android-capture
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK integrity and debug signature
        run: |
          APK_PATH="android-capture/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          unzip -tq "$APK_PATH"
          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"
          unzip -l "$APK_PATH" | grep -q "classes.*\.dex"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Publish APK and metadata to public/downloads
        run: |
          mkdir -p public/downloads
          cp android-capture/app/build/outputs/apk/debug/app-debug.apk public/downloads/livecast-companion.apk

          VERSION_NAME=$(grep -E 'versionName\s*=' android-capture/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
          VERSION_CODE=$(grep -E 'versionCode\s*=' android-capture/app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/' | head -n 1)
          SIZE_BYTES=$(stat -c%s public/downloads/livecast-companion.apk)
          SHA256_HASH=$(sha256sum public/downloads/livecast-companion.apk | awk '{print $1}')
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat <<EOF > public/downloads/apk-metadata.json
          {
            "available": true,
            "appName": "Livecast Android Capture",
            "packageName": "com.livecast.capture",
            "buildVariant": "debug",
            "versionName": "${VERSION_NAME:-1.0.0}",
            "versionCode": ${VERSION_CODE:-1},
            "buildDateIso": "${BUILD_DATE}",
            "sizeBytes": ${SIZE_BYTES},
            "sha256": "${SHA256_HASH}",
            "commitSha": "${GITHUB_SHA}",
            "downloadPath": "/downloads/livecast-companion.apk",
            "workflowRunUrl": "${WORKFLOW_URL}"
          }
          EOF

      - name: Commit and push published APK for Netlify auto-deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/livecast-companion.apk public/downloads/apk-metadata.json
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi
          git commit -m "chore(android): publish livecast-companion.apk (${GITHUB_SHA::7})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: livecast-android-capture-debug-apk
          path: public/downloads/livecast-companion.apk
          if-no-files-found: error
